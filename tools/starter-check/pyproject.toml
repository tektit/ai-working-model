[project]
name = "starter-check"
version = "0.1.0"
description = "Verifies that starter/ is a self-contained tree a user can copy into a new repo: every relative link and @import resolves, nothing points back at this repo, CLAUDE.md is exactly @AGENTS.md, and AGENTS.md links every principle heading exactly once."
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
starter-check = "starter_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter_check"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
